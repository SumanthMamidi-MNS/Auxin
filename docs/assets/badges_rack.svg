    <text x="142.0" y="67.5" class="badge-text">Supabase Auth</text>
    <rect x="251.0" y="48" width="152" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="264.0" cy="63" r="4" fill="#EA4335" filter="url(#pinGlow)"/>
    <text x="274.0" y="67.5" class="badge-text">Transactional Email</text>
    <rect x="411.0" y="48" width="132" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="424.0" cy="63" r="4" fill="#D43D31" filter="url(#pinGlow)"/>
    <text x="434.0" y="67.5" class="badge-text">SQLAlchemy 2.0</text>
    <rect x="551.0" y="48" width="136" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="564.0" cy="63" r="4" fill="#0088FF" filter="url(#pinGlow)"/>
    <text x="574.0" y="67.5" class="badge-text">Razorpay Escrow</text>
    <rect x="695.0" y="48" width="106" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="708.0" cy="63" r="4" fill="#199900" filter="url(#pinGlow)"/>
    <text x="718.0" y="67.5" class="badge-text">Leaflet GPS</text>
  </g>

  <!-- Row 3 (Verification & AI) -->
  <g id="row3">
    <rect x="325.0" y="88" width="150" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="338.0" cy="103" r="4" fill="#22C55E" filter="url(#pinGlow)"/>
    <text x="348.0" y="107.5" class="badge-text">73/73 Pytest (100%)</text>
    <rect x="483.0" y="88" width="112" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="496.0" cy="103" r="4" fill="#D4AF37" filter="url(#pinGlow)"/>
    <text x="506.0" y="107.5" class="badge-text">Milo AI RAG</text>
  </g>
</svg>