<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="120" fill="none">
  <defs>
    <filter id="pinGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .badge-text {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      font-weight: 600;
      font-size: 12.5px;
      fill: #E2E8F0;
      letter-spacing: 0.1px;
    }
  </style>

  <!-- Row 1 (Core Web & Backend) -->
  <g id="row1">
    <rect x="63.0" y="8" width="108" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="76.0" cy="23" r="4" fill="#3776AB" filter="url(#pinGlow)"/>
    <text x="86.0" y="27.5" class="badge-text">Python 3.12</text>
    <rect x="179.0" y="8" width="118" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="192.0" cy="23" r="4" fill="#009688" filter="url(#pinGlow)"/>
    <text x="202.0" y="27.5" class="badge-text">FastAPI Async</text>
    <rect x="305.0" y="8" width="114" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="318.0" cy="23" r="4" fill="#46E3B7" filter="url(#pinGlow)"/>
    <text x="328.0" y="27.5" class="badge-text">Render Cloud</text>
    <rect x="427.0" y="8" width="96" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="440.0" cy="23" r="4" fill="#FFFFFF" filter="url(#pinGlow)"/>
    <text x="450.0" y="27.5" class="badge-text">Next.js 16</text>
    <rect x="531.0" y="8" width="92" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="544.0" cy="23" r="4" fill="#61DAFB" filter="url(#pinGlow)"/>
    <text x="554.0" y="27.5" class="badge-text">React 19</text>
    <rect x="631.0" y="8" width="112" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="644.0" cy="23" r="4" fill="#3178C6" filter="url(#pinGlow)"/>
    <text x="654.0" y="27.5" class="badge-text">TypeScript 5</text>
    <rect x="751.0" y="8" width="106" height="30" rx="15" fill="#141C26" fill-opacity="0.85" stroke="#263342" stroke-width="1.2"/>
    <circle cx="764.0" cy="23" r="4" fill="#38BDF8" filter="url(#pinGlow)"/>
    <text x="774.0" y="27.5" class="badge-text">Tailwind v4</text>
  </g>

  <!-- Row 2 (Persistence, Auth & Services) -->
