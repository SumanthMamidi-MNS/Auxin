<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50" width="320" height="50" fill="none">
  <defs>
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#818CF8" flood-opacity="0.9" />
    </filter>
  </defs>

  <style>
    .pill-text {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      fill: #FFFFFF;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Pill Container -->
  <rect x="3" y="3" width="314" height="44" rx="22" fill="#181938" stroke="#6366F1" stroke-width="1.6" filter="url(#pillGlow)" />

  <!-- Glowing Indicator Dot -->
  <circle cx="34" cy="25" r="5" fill="#818CF8" filter="url(#dotGlow)" />

  <!-- Button Text -->
  <text x="52" y="30" class="pill-text">Open Live Deployment →</text>
</svg>
