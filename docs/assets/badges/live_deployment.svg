<svg xmlns="http://www.w3.org/2000/svg" width="210" height="34" viewBox="0 0 210 34" fill="none">
  <defs>
    <linearGradient id="bg_live" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="sheen_live" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="aura_live" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip_live">
      <rect x="1" y="1" width="208" height="32" rx="16" />
    </clipPath>
  </defs>

  <!-- Ambient Outer Glow Aura -->
  <rect x="2" y="2" width="206" height="30" rx="15" fill="none" stroke="#818CF8" opacity="0.4" filter="url(#aura_live)">
    <animate attributeName="opacity" values="0.25;0.75;0.25" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.2;2.8;1.2" dur="2.8s" repeatCount="indefinite" />
  </rect>

  <!-- Base Capsule -->
  <rect x="1" y="1" width="208" height="32" rx="16" fill="url(#bg_live)" />

  <!-- Animated Border -->
  <rect x="1" y="1" width="208" height="32" rx="16" fill="none" stroke="#6366F1" stroke-width="1.4">
    <animate attributeName="stroke" values="#6366F1;#A5B4FC;#6366F1" dur="2.8s" repeatCount="indefinite" />
  </rect>

  <!-- Specular Top Rim -->
  <path d="M 18 2 L 192 2" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" stroke-linecap="round" />

  <!-- Continuous Glass Light Sweep -->
  <g clip-path="url(#clip_live)">
    <polygon points="0,0 45,0 20,34 -25,34" fill="url(#sheen_live)">
      <animateTransform attributeName="transform" type="translate" from="-70 0" to="260 0" dur="2.5s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Glowing Radar Node -->
  <circle cx="22" cy="17" r="4.5" fill="none" stroke="#818CF8">
    <animate attributeName="r" values="4.5;10;13" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0.3;0" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.6;1;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="22" cy="17" r="4.2" fill="#818CF8">
    <animate attributeName="r" values="3.8;4.8;3.8" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="22" cy="17" r="1.8" fill="#FFFFFF" />

  <!-- Text -->
  <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.3px">Open Live Deployment</text>
  <text x="184" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#818CF8">→</text>
</svg>