<svg xmlns="http://www.w3.org/2000/svg" width="140" height="32" viewBox="0 0 140 32" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_fastapi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181E29" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0E131C" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Specular Sheen Gradient -->
    <linearGradient id="sheen_fastapi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Aura Glow Filter -->
    <filter id="aura_fastapi" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Path inside Capsule -->
    <clipPath id="clip_fastapi">
      <rect x="3" y="2" width="134" height="28" rx="14" />
    </clipPath>

    <!-- Dual Engine Animations: CSS Keyframes + SMIL -->
    <style>
      @keyframes sweep_fastapi {
        0% { transform: translateX(-70px); opacity: 0; }
        12% { opacity: 1; }
        48% { transform: translateX(190px); opacity: 1; }
        52%, 100% { transform: translateX(190px); opacity: 0; }
      }
      @keyframes border_fastapi {
        0%, 100% { stroke: rgba(255, 255, 255, 0.16); stroke-width: 1.2px; }
        50% { stroke: #34D399; stroke-width: 1.6px; }
      }
      @keyframes gem_fastapi {
        0%, 100% { transform: scale(0.92); transform-origin: 17px 16px; }
        50% { transform: scale(1.18); transform-origin: 17px 16px; }
      }
      @keyframes spec_fastapi {
        0%, 100% { fill: #94A3B8; }
        50% { fill: #34D399; }
      }

      .sheen-beam {
        animation: sweep_fastapi 3.2s infinite cubic-bezier(0.25, 1, 0.5, 1);
      }
      .capsule-border {
        animation: border_fastapi 3.2s infinite ease-in-out;
      }
      .gem-pulse {
        animation: gem_fastapi 2.2s infinite ease-in-out;
      }
      .spec-glow {
        animation: spec_fastapi 3.2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Ambient Outer Glow Aura (Continuous Breathing) -->
  <rect x="3" y="2" width="134" height="28" rx="14" fill="none" stroke="#34D399" opacity="0.35" filter="url(#aura_fastapi)">
    <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1;2.4;1" dur="3.2s" repeatCount="indefinite" />
  </rect>

  <!-- Dark Obsidian Base Capsule -->
  <rect x="3" y="2" width="134" height="28" rx="14" fill="url(#bg_fastapi)" />

  <!-- Animated Sharp Border with Living Glow -->
  <rect class="capsule-border" x="3" y="2" width="134" height="28" rx="14" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.2">
    <animate attributeName="stroke" values="rgba(255,255,255,0.16);#34D399;rgba(255,255,255,0.16)" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.2;1.6;1.2" dur="3.2s" repeatCount="indefinite" />
  </rect>

  <!-- Specular Top Rim Reflection -->
  <path d="M 17 3 L 123 3" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" stroke-linecap="round" />

  <!-- CONTINUOUS SHINY GLASS SWEEP (Slanted Specular Sheen Beam) -->
  <g clip-path="url(#clip_fastapi)">
    <polygon class="sheen-beam" points="0,0 38,0 16,28 -22,28" fill="url(#sheen_fastapi)">
      <animateTransform attributeName="transform" type="translate" from="-70 0" to="190 0" dur="3.2s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Pulsing Radar Beacon Ring from Gem -->
  <circle cx="17" cy="16" r="3.8" fill="none" stroke="#34D399">
    <animate attributeName="r" values="3.8;8.5;11.5" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.85;0.3;0" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.5;1;0.2" dur="2.2s" repeatCount="indefinite" />
  </circle>

  <!-- Glowing Gem Core -->
  <circle class="gem-pulse" cx="17" cy="16" r="3.8" fill="#34D399">
    <animate attributeName="r" values="3.5;4.3;3.5" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="17" cy="16" r="1.5" fill="#FFFFFF" opacity="0.95" />

  <!-- Title Text -->
  <text x="29" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="11.8" font-weight="700" fill="#F8FAFC" letter-spacing="0.2px">FastAPI</text>

  <!-- Micro Divider Line -->
  <line x1="86" y1="9.5" x2="86" y2="20.5" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1" />

  <!-- Spec / Version Text (Subtle continuous brand color pulse) -->
  <text class="spec-glow" x="93" y="18.2" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="0.3px">
    Async
    <animate attributeName="fill" values="#94A3B8;#34D399;#94A3B8" dur="3.2s" repeatCount="indefinite" />
  </text>
</svg>