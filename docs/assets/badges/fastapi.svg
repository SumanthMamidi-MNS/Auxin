<svg xmlns="http://www.w3.org/2000/svg" width="139" height="31" viewBox="0 0 139 31" fill="none">
  <defs>
    <!-- Dark Obsidian Gradient Fill -->
    <linearGradient id="bg_fastapi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161D29" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0A0E16" stop-opacity="0.99"/>
    </linearGradient>

    <!-- Translucent Specular Sheen Gradient -->
    <linearGradient id="sheen_fastapi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Capsule Boundary Clip (Zero halo/fuzz) -->
    <clipPath id="clip_fastapi">
      <rect x="0.75" y="0.75" width="137.5" height="29.5" rx="14.75" />
    </clipPath>

    <style>
      @keyframes gem_pulse_fastapi {
        0%, 100% { transform: scale(0.92); transform-origin: 16.0px 15.5px; }
        50% { transform: scale(1.18); transform-origin: 16.0px 15.5px; }
      }
      .gem-pulse {
        animation: gem_pulse_fastapi 2.4s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Base Obsidian Capsule Body -->
  <rect x="0.75" y="0.75" width="137.5" height="29.5" rx="14.75" fill="url(#bg_fastapi)" />

  <!-- Animated Neon Perimeter Border -->
  <rect x="0.75" y="0.75" width="137.5" height="29.5" rx="14.75" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2">
    <animate attributeName="stroke" values="rgba(255,255,255,0.18);#34D399;rgba(255,255,255,0.18)" dur="3.6s" begin="0.6s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.1;1.7;1.1" dur="3.6s" begin="0.6s" repeatCount="indefinite" />
  </rect>

  <!-- Specular Top Rim Reflection -->
  <path d="M 14 1.5 L 125 1.5" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.9" stroke-linecap="round" />

  <!-- Continuous Top-to-Bottom Specular Sheen (Zero Stuck Bands) -->
  <g clip-path="url(#clip_fastapi)">
    <g transform="rotate(14)">
      <rect x="-30" y="-40" width="189" height="18" fill="url(#sheen_fastapi)" opacity="0">
        <animateTransform attributeName="transform" type="translate"
          additive="sum"
          values="0 -30; 0 71; 0 71; 0 -30"
          keyTimes="0; 0.45; 0.50; 1"
          dur="3.6s" begin="0.6s" repeatCount="indefinite" />
        <animate attributeName="opacity"
          values="0; 0.85; 0.85; 0; 0"
          keyTimes="0; 0.10; 0.40; 0.46; 1"
          dur="3.6s" begin="0.6s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Pulsing Radar Beacon Ring from Gem -->
  <circle cx="16.0" cy="15.5" r="3.8" fill="none" stroke="#34D399">
    <animate attributeName="r" values="3.8;8.5;12" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.85;0.25;0" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.5;0.9;0.2" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- Glowing Gem Core -->
  <circle class="gem-pulse" cx="16.0" cy="15.5" r="3.8" fill="#34D399">
    <animate attributeName="r" values="3.4;4.4;3.4" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="16.0" cy="15.5" r="1.4" fill="#FFFFFF" opacity="0.95" />

  <!-- Title Text -->
  <text x="28.0" y="19.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" letter-spacing="0.2px">FastAPI</text>

  <!-- Micro Divider Line -->
  <line x1="84" y1="9" x2="84" y2="22" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.0" />

  <!-- Spec / Version Text -->
  <text x="92.0" y="19.5" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="10.8" font-weight="700" fill="#94A3B8" letter-spacing="0.25px">
    Async
    <animate attributeName="fill" values="#94A3B8;#34D399;#94A3B8" dur="3.6s" begin="0.6s" repeatCount="indefinite" />
  </text>
</svg>