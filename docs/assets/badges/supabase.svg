<svg xmlns="http://www.w3.org/2000/svg" width="160" height="38" viewBox="0 0 160 38" fill="none">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg_supabase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19202C" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0D121B" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Top-to-Bottom Specular Sheen Gradient (Vertical sweep) -->
    <linearGradient id="sheen_v_supabase" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Aura Glow Filter -->
    <filter id="aura_supabase" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Capsule Clip Path -->
    <clipPath id="clip_supabase">
      <rect x="4" y="2" width="152" height="34" rx="17" />
    </clipPath>

    <!-- Keyframe Animations (Top-to-Bottom Sweep + Glow Pulse) -->
    <style>
      @keyframes sweep_down_supabase {
        0% {
          transform: translateY(-45px) rotate(15deg);
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        45% {
          transform: translateY(69px) rotate(15deg);
          opacity: 1;
        }
        50%, 100% {
          transform: translateY(69px) rotate(15deg);
          opacity: 0;
        }
      }
      @keyframes aura_pulse_supabase {
        0%, 100% { stroke: rgba(255, 255, 255, 0.16); stroke-width: 1.2px; }
        50% { stroke: #10B981; stroke-width: 1.8px; }
      }
      @keyframes gem_pulse_supabase {
        0%, 100% { transform: scale(0.92); transform-origin: 20px 19px; }
        50% { transform: scale(1.18); transform-origin: 20px 19px; }
      }
      @keyframes spec_glow_supabase {
        0%, 100% { fill: #94A3B8; }
        50% { fill: #10B981; }
      }

      .sheen-down {
        animation: sweep_down_supabase 3.8s infinite cubic-bezier(0.22, 1, 0.36, 1);
        animation-delay: 1.8s;
      }
      .capsule-border {
        animation: aura_pulse_supabase 3.8s infinite ease-in-out;
        animation-delay: 1.8s;
      }
      .gem-pulse {
        animation: gem_pulse_supabase 2.2s infinite ease-in-out;
      }
      .spec-text {
        animation: spec_glow_supabase 3.8s infinite ease-in-out;
        animation-delay: 1.8s;
      }
    </style>
  </defs>

  <!-- Ambient Outer Glow Aura (Continuous Breathing) -->
  <rect x="4" y="2" width="152" height="34" rx="17" fill="none" stroke="#10B981" opacity="0.38" filter="url(#aura_supabase)">
    <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.8s" begin="1.8s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1;2.6;1" dur="3.8s" begin="1.8s" repeatCount="indefinite" />
  </rect>

  <!-- Dark Obsidian Base Capsule -->
  <rect x="4" y="2" width="152" height="34" rx="17" fill="url(#bg_supabase)" />

  <!-- Animated Sharp Border with Living Glow -->
  <rect class="capsule-border" x="4" y="2" width="152" height="34" rx="17" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.3">
    <animate attributeName="stroke" values="rgba(255,255,255,0.16);#10B981;rgba(255,255,255,0.16)" dur="3.8s" begin="1.8s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.2;1.8;1.2" dur="3.8s" begin="1.8s" repeatCount="indefinite" />
  </rect>

  <!-- Specular Top Rim Reflection -->
  <path d="M 20 3.2 L 140 3.2" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.1" stroke-linecap="round" />

  <!-- CONTINUOUS TOP-TO-BOTTOM SHINY GLASS SWEEP -->
  <g clip-path="url(#clip_supabase)">
    <rect class="sheen-down" x="-20" y="-35" width="220" height="28" fill="url(#sheen_v_supabase)" transform="rotate(15)">
      <animateTransform attributeName="transform" type="translate" from="0 -50" to="0 79" dur="3.8s" begin="1.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Pulsing Radar Beacon Ring from Gem -->
  <circle cx="20" cy="19" r="4.2" fill="none" stroke="#10B981">
    <animate attributeName="r" values="4.2;9.5;13" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.85;0.25;0" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.6;1;0.2" dur="2.2s" repeatCount="indefinite" />
  </circle>

  <!-- Glowing Gem Core -->
  <circle class="gem-pulse" cx="20" cy="19" r="4.2" fill="#10B981">
    <animate attributeName="r" values="3.8;4.8;3.8" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="20" cy="19" r="1.6" fill="#FFFFFF" opacity="0.95" />

  <!-- Title Text (Enlarged to 12.8px) -->
  <text x="34" y="22.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="12.8" font-weight="700" fill="#F8FAFC" letter-spacing="0.25px">Supabase</text>

  <!-- Micro Divider Line -->
  <line x1="105" y1="11" x2="105" y2="25" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.1" />

  <!-- Spec / Version Text (Enlarged to 11.5px) -->
  <text class="spec-text" x="114" y="22.5" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="11.5" font-weight="700" fill="#94A3B8" letter-spacing="0.3px">
    Auth
    <animate attributeName="fill" values="#94A3B8;#10B981;#94A3B8" dur="3.8s" begin="1.8s" repeatCount="indefinite" />
  </text>
</svg>