<svg xmlns="http://www.w3.org/2000/svg" width="138" height="34" viewBox="0 0 138 34" fill="none">
  <defs>
    <!-- Dark Obsidian Gradient Fill -->
    <linearGradient id="bg_python" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161D29" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0A0E16" stop-opacity="0.99"/>
    </linearGradient>

    <!-- Translucent Specular Sheen Gradient -->
    <linearGradient id="sheen_python" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Capsule Boundary Clip (Zero halo/fuzz) -->
    <clipPath id="clip_python">
      <rect x="0.75" y="0.75" width="136.5" height="32.5" rx="16.25" />
    </clipPath>

    <style>
      @keyframes gem_pulse_python {
        0%, 100% { transform: scale(0.92); transform-origin: 18.0px 17.0px; }
        50% { transform: scale(1.18); transform-origin: 18.0px 17.0px; }
      }
      .gem-pulse {
        animation: gem_pulse_python 2.4s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Base Obsidian Capsule Body -->
  <rect x="0.75" y="0.75" width="136.5" height="32.5" rx="16.25" fill="url(#bg_python)" />

  <!-- Animated Neon Perimeter Border -->
  <rect x="0.75" y="0.75" width="136.5" height="32.5" rx="16.25" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.3">
    <animate attributeName="stroke" values="rgba(255,255,255,0.18);#38BDF8;rgba(255,255,255,0.18)" dur="3.6s" begin="1.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.2;1.8;1.2" dur="3.6s" begin="1.2s" repeatCount="indefinite" />
  </rect>

  <!-- Specular Top Rim Reflection -->
  <path d="M 16 1.8 L 122 1.8" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1" stroke-linecap="round" />

  <!-- Continuous Top-to-Bottom Specular Sheen (Zero Stuck Bands) -->
  <g clip-path="url(#clip_python)">
    <g transform="rotate(14)">
      <rect x="-30" y="-45" width="198" height="20" fill="url(#sheen_python)" opacity="0">
        <animateTransform attributeName="transform" type="translate"
          additive="sum"
          values="0 -35; 0 79; 0 79; 0 -35"
          keyTimes="0; 0.45; 0.50; 1"
          dur="3.6s" begin="1.2s" repeatCount="indefinite" />
        <animate attributeName="opacity"
          values="0; 0.85; 0.85; 0; 0"
          keyTimes="0; 0.10; 0.40; 0.46; 1"
          dur="3.6s" begin="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Pulsing Radar Beacon Ring from Gem -->
  <circle cx="18.0" cy="17.0" r="4.2" fill="none" stroke="#38BDF8">
    <animate attributeName="r" values="4.2;9.5;13" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.85;0.25;0" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.6;1;0.2" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- Glowing Gem Core -->
  <circle class="gem-pulse" cx="18.0" cy="17.0" r="4.2" fill="#38BDF8">
    <animate attributeName="r" values="3.8;4.8;3.8" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="18.0" cy="17.0" r="1.6" fill="#FFFFFF" opacity="0.95" />

  <!-- Title Text -->
  <text x="32.0" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="12.8" font-weight="700" fill="#F8FAFC" letter-spacing="0.25px">Python</text>

  <!-- Micro Divider Line -->
  <line x1="86" y1="10" x2="86" y2="24" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.1" />

  <!-- Spec / Version Text -->
  <text x="95.0" y="21.2" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="11.5" font-weight="700" fill="#94A3B8" letter-spacing="0.3px">
    3.12
    <animate attributeName="fill" values="#94A3B8;#38BDF8;#94A3B8" dur="3.6s" begin="1.2s" repeatCount="indefinite" />
  </text>
</svg>