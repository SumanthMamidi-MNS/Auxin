    <path d="M24 74 L46 26"/>
    <path d="M68 74 L46 26"/>
    <path d="M33 58 H59"/>
  </g>
  <!-- the growing shoot at the apex: auxin is the plant hormone that drives growth -->
  <path d="M47 27 C46 14 58 8 71 10 C72 22 62 30 47 27 Z" fill="url(#auxLeaf)"/>
  <path d="M49 26 C55 20 61 16 67 13" fill="none" stroke="#05823A" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
