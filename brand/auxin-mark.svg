<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Auxin">
  <defs>
    <linearGradient id="auxBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19E37E"/>
      <stop offset="1" stop-color="#05823A"/>
    </linearGradient>
    <linearGradient id="auxLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD25A"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </linearGradient>
  </defs>
  <!-- app-icon tile -->
  <rect width="96" height="96" rx="24" fill="url(#auxBg)"/>
  <!-- the "A": two sturdy legs and a crossbar, drawn with one rounded stroke weight -->
