# nixpacks.toml
# ──────────────────────────────────────────────────────────────────────────────
# Railway uses Nixpacks as its build system.
# This config tells it to use Python 3.11 and run the correct start command.
# ──────────────────────────────────────────────────────────────────────────────

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
# Run migrations automatically on every deploy (safe with alembic's idempotent upgrades)
cmds = ["alembic upgrade head"]

[start]
cmd = "gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120"
